name: midterm
description: "A new Flutter project."
# Prevent accidental publishing to pub.dev (remove this line if you wish to publish)
publish_to: 'none'

# Versioning for the application
version: 1.0.0+1

# Specify the Dart SDK version constraint
environment:
  sdk: '>=3.7.0 <4.0.0'

# Dependencies for the project
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  app_links: ^6.4.0  # Replace uni_links
  image_picker: ^1.0.7
  google_sign_in: ^6.2.1
  cloud_functions: ^5.4.0
  file_picker: ^8.3.7
  cupertino_icons: ^1.0.8
  firebase_database: ^11.3.5

# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Flutter-specific configurations
flutter:
  # Enable Material Design icons
  uses-material-design: true

  # Add custom fonts (uncomment and modify as needed)
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700